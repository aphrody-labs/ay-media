name: sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aphrody-labs/ay-vercel
          path: .ay-vercel
          sparse-checkout: tools
          persist-credentials: false
      - run: echo "AY_VERCEL=$GITHUB_WORKSPACE/.ay-vercel" >> "$GITHUB_ENV"
      - run: bun "$AY_VERCEL/tools/forks.ts" --check
      - run: bun "$AY_VERCEL/tools/submodules.ts" --check
      - run: bun "$AY_VERCEL/tools/sync.ts"
