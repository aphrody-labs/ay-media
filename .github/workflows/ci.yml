name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun tools/private-gate.ts
      - run: bun tools/forks.ts --check
      - run: bun tools/submodules.ts --check
