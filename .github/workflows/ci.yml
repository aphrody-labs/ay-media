name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun tools/private-gate.ts
      - uses: actions/checkout@v4
        with:
          repository: aphrody-labs/ay-vercel
          path: .ay-vercel
          sparse-checkout: tools
          persist-credentials: false
      - run: echo "AY_VERCEL=$GITHUB_WORKSPACE/.ay-vercel" >> "$GITHUB_ENV"
      - run: bun "$AY_VERCEL/tools/forks.ts" --check
      - run: bun "$AY_VERCEL/tools/submodules.ts" --check
